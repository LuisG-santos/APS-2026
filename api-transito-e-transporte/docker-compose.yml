services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - transito-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: aps-transito-migrate:1.0.0
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: aps-transito:1.0.0
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      PORT: "3003"
    ports:
      - "${API_PORT:-3003}:3003"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3003/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  client:
    image: curlimages/curl:8.12.1
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        curl --fail --silent http://api:3003/health/ready
        curl --fail --silent http://api:3003/get/transito

volumes:
  transito-db-data:
