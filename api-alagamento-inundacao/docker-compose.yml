services:
  db:
    image: postgres:16
    container_name: alagamento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alagamento
    ports:
      - "5433:5432"
    volumes:
      - alagamento-db-data:/var/lib/postgresql/data

volumes:
  alagamento-db-data:
