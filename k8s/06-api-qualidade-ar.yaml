apiVersion: v1
kind: Service
metadata:
  name: api-qualidade-ar
  namespace: aps
spec:
  selector:
    app: api-qualidade-ar
  ports:
  - name: http
    port: 3002
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-qualidade-ar
  namespace: aps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  selector:
    matchLabels:
      app: api-qualidade-ar
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-qualidade-ar
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: aguardar-migrations
        image: aps-migrate:etapa3-v1
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -ec
        args:
        - until node node_modules/prisma/build/index.js migrate status; do echo "Aguardando banco e migrations...";
          sleep 5; done
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aps-db
              key: DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      containers:
      - name: api
        lifecycle:
          preStop:
            exec:
              command: [sh, -c, "sleep 5"]
        image: aps-qualidade-ar:etapa3-v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3002
        envFrom:
        - configMapRef:
            name: aps-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aps-db
              key: DATABASE_URL
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: aps-config
              key: QUALIDADE_AR_PORT
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
