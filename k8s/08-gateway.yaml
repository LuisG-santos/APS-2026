apiVersion: v1
kind: ConfigMap
metadata:
  name: aps-gateway-config
  namespace: aps
data:
  middlewares.yaml: |
    http:
      middlewares:
        remover-prefixo-api:
          stripPrefix:
            prefixes:
              - /alagamento
              - /qualidade-ar
              - /transito
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aps-gateway
  namespace: aps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aps-gateway
  namespace: aps
rules:
- apiGroups:
  - ''
  resources:
  - services
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses/status
  verbs:
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aps-gateway
  namespace: aps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aps-gateway
subjects:
- kind: ServiceAccount
  name: aps-gateway
  namespace: aps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aps-gateway
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - ingressclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aps-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aps-gateway
subjects:
- kind: ServiceAccount
  name: aps-gateway
  namespace: aps
---
apiVersion: v1
kind: Service
metadata:
  name: aps-gateway
  namespace: aps
spec:
  selector:
    app: aps-gateway
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aps-gateway
  namespace: aps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aps-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: aps-gateway
    spec:
      serviceAccountName: aps-gateway
      containers:
      - name: traefik
        image: traefik:v3.7.15
        imagePullPolicy: IfNotPresent
        args:
        - --entrypoints.web.address=:8000
        - --entrypoints.health.address=:9000
        - --providers.kubernetesingress=true
        - --providers.kubernetesingress.namespaces=aps
        - --providers.kubernetesingress.ingressclass=aps-traefik
        - --providers.kubernetesingress.strictprefixmatching=true
        - --providers.file.filename=/etc/traefik/dynamic/middlewares.yaml
        - --ping=true
        - --ping.entrypoint=health
        - --api.dashboard=false
        - --accesslog=true
        - --accesslog.format=json
        ports:
        - name: http
          containerPort: 8000
        - name: health
          containerPort: 9000
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /ping
            port: health
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/traefik/dynamic
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: aps-gateway-config
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: aps-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aps
  namespace: aps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: remover-prefixo-api@file
spec:
  ingressClassName: aps-traefik
  rules:
  - http:
      paths:
      - path: /alagamento
        pathType: Prefix
        backend:
          service:
            name: api-alagamento
            port:
              number: 3001
      - path: /qualidade-ar
        pathType: Prefix
        backend:
          service:
            name: api-qualidade-ar
            port:
              number: 3002
      - path: /transito
        pathType: Prefix
        backend:
          service:
            name: api-transito
            port:
              number: 3003
