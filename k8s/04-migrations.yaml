apiVersion: batch/v1
kind: Job
metadata:
  name: aps-migrate-etapa3-v1
  namespace: aps
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: aps-migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: aps-migrate:etapa3-v1
        imagePullPolicy: IfNotPresent
        command:
        - npm
        - run
        - db:migrate
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aps-db
              key: DATABASE_URL
        envFrom:
        - configMapRef:
            name: aps-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
