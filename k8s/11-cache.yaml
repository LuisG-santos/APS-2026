apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: aps
spec:
  selector:
    app: cache
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: aps
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cache
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: redis
        image: redis:8.2.3-alpine
        args:
        - redis-server
        - --save
        - ''
        - --appendonly
        - 'no'
        - --maxmemory
        - 64mb
        - --maxmemory-policy
        - allkeys-lru
        - --protected-mode
        - 'no'
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        startupProbe:
          exec:
            command: [redis-cli, ping]
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: redis
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          exec:
            command: [redis-cli, ping]
          periodSeconds: 5
          timeoutSeconds: 2
        volumeMounts:
        - name: dados
          mountPath: /data
      volumes:
      - name: dados
        emptyDir: {}
