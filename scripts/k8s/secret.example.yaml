# Exemplo de estrutura. O script gerar-secret.ps1 cria o arquivo local a partir de .env.k8s.
# Os valores reais ficam em k8s/02-secret.local.yaml, ignorado pelo Git e pelo build Docker.
apiVersion: v1
kind: Secret
metadata:
  name: aps-db
  namespace: aps
type: Opaque
stringData:
  POSTGRES_USER: aps
  POSTGRES_PASSWORD: SUBSTITUA_LOCALMENTE
  DATABASE_URL: postgresql://aps:SUBSTITUA_LOCALMENTE@banco:5432/aps?connection_limit=5&pool_timeout=3&connect_timeout=2
