# Exemplo somente. Use node scripts/k8s/gerar-secret-fila.mjs para gerar senha local.
apiVersion: v1
kind: Secret
metadata:
  name: aps-fila
  namespace: aps
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: aps
  RABBITMQ_DEFAULT_PASS: SUBSTITUA_LOCALMENTE
  RABBITMQ_URL: amqp://aps:SUBSTITUA_LOCALMENTE@fila:5672?heartbeat=5
